[project]
name = "agentguard"
version = "0.1.0"
description = "AgentGuard — 포맷 무관 통합 보안 엔진 (파일/AI도구 위험 검사 + 자연어 통역 API)"
license = { text = "MIT" }
authors = [{ name = "이동훈 (DONGHUN LEE)" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "olefile>=0.47",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]   # Claude 통역 (없으면 i18n_key 폴 백으로 자동 동작)
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
