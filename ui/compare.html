<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGuard — 같은 위험, 다른 이해</title>
<style>
  :root{--ink:#16181D;--sub:#6B7280;--line:#E8E8EA;--accent:#5B5BD6;--red:#E5484D;--yellow:#B45309;--green:#30A46C;--bg:#F7F7F9;--card:#fff;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;}
  body{background:var(--bg);color:var(--ink);}
  .wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .top b{font-size:17px;} .top .u{color:var(--accent);}
  .top a{font-size:12.5px;color:var(--sub);text-decoration:none;font-weight:700;}
  h1{font-size:22px;letter-spacing:-.02em;text-align:center;}
  .lead{text-align:center;color:var(--sub);font-size:13.5px;margin:6px 0 18px;}
  .drop{border:2px dashed #CBD2D9;border-radius:14px;background:var(--card);padding:26px;text-align:center;color:var(--sub);font-size:13.5px;cursor:pointer;transition:.15s;margin-bottom:18px;}
  .drop:hover,.drop.on{border-color:var(--accent);color:var(--accent);background:#F6F6FE;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .pane{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;}
  .pane .hd{padding:11px 15px;font-size:12px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;}
  .pane.av .hd{background:#F4F5F8;color:var(--sub);}
  .pane.ag .hd{background:rgba(91,91,214,.08);color:var(--accent);}
  .pane .bd{padding:16px;min-height:200px;font-size:13.5px;line-height:1.65;}
  .avcode{font-family:ui-monospace,Menlo,monospace;background:#16181D;color:#E6E8ED;border-radius:10px;padding:14px;font-size:12.5px;line-height:1.8;white-space:pre-line;}
  .avcode .dim{color:#9CA3AF;}
  .sig{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px;}
  .sig.red{color:var(--red)} .sig.yellow{color:var(--yellow)} .sig.green{color:var(--green)}
  .kv{padding:7px 0;border-top:1px solid #F4F5F8;} .kv:first-of-type{border-top:0;}
  .kv .k{font-size:11px;color:var(--sub);font-weight:800;}
  .act{margin-top:10px;border-radius:10px;padding:10px;font-size:13px;font-weight:800;}
  .act.red{background:#FCECEC;color:var(--red)} .act.yellow{background:#FFF7E8;color:var(--yellow)} .act.green{background:#EEF9F2;color:var(--green)}
  .vs{display:flex;justify-content:center;margin:-6px 0 14px;}
  .vs span{background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:4px 12px;}
  .empty{color:var(--sub);text-align:center;padding:40px 0;font-size:13px;}
  .busy{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);padding:40px 0;font-size:13px;}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>🛡️ AgentGuard <span class="u">비교 시연</span></b><a href="/">← 대시보드</a></div>
  <h1>같은 위험, 다른 이해</h1>
  <div class="lead">같은 파일을 기존 백신과 AgentGuard가 어떻게 다르게 말해주는지 비교해 보세요.</div>

  <div class="drop" id="drop">
    <b style="color:var(--ink)">검사할 파일을 여기에 놓으세요</b><br>
    HWP·DOCX·PDF·MCP·확장 manifest — 원본은 기기 안에서만 검사해요
    <input id="file" type="file" hidden>
  </div>

  <div class="vs"><span>VS</span></div>

  <div class="grid">
    <div class="pane av">
      <div class="hd">🦠 기존 백신의 말</div>
      <div class="bd" id="avBody"><div class="empty">파일을 넣으면 여기에 백신식 경고가 떠요</div></div>
    </div>
    <div class="pane ag">
      <div class="hd">🛡️ AgentGuard의 말</div>
      <div class="bd" id="agBody"><div class="empty">파일을 넣으면 여기에 쉬운 말 통역이 떠요</div></div>
    </div>
  </div>
</div>

<script>
const drop=document.getElementById("drop"), file=document.getElementById("file");
const av=document.getElementById("avBody"), ag=document.getElementById("agBody");
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on");};
drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");scan(e.dataTransfer.files[0]);};
file.onchange=e=>scan(e.target.files[0]);

const KO={red:"위험",yellow:"주의",green:"안전"};

// 백신식 문자열 생성(모의): 룰 ID → 백신 시그니처 풍
function avName(v){
  const ids=v.findings.map(f=>f.rule_id);
  if(!ids.length) return null;
  if(ids.some(i=>i.startsWith("HID"))) return "Trojan.Script.Injector.Gen";
  if(ids.some(i=>i.startsWith("EXEC"))) return "Trojan.Generic."+String(10000+ids.length*137);
  if(ids.some(i=>i.startsWith("EMB"))) return "Heur.OLE.Suspicious";
  if(ids.some(i=>i.startsWith("NET"))) return "Riskware.URL.Agent";
  return "Suspicious.File."+v.surface_kind.toUpperCase();
}

function paintAV(v){
  const name=avName(v);
  av.innerHTML = v.overall==="green"
    ? '<div class="avcode">Scan complete.\n<span class="dim">No threats found.</span></div>'
    : '<div class="avcode">⚠ Threat detected!\n'+(name||"Trojan.Generic")+'\n'+
      '<span class="dim">Severity: '+(v.overall==="red"?"High":"Medium")+
      '  ·  Action: Quarantine\nDetails: '+v.findings.length+' signature(s) matched</span></div>'+
      '<div class="lead" style="margin:10px 2px 0;font-size:12px;text-align:left">…그래서 이 파일이 뭘 한다는 걸까요? 🤔</div>';
}

function paintAG(v){
  const c=v.card||{}, o=v.overall;
  ag.innerHTML =
    '<div class="sig '+o+'">'+({red:"🔴",yellow:"🟡",green:"🟢"})[o]+" "+(c.headline||"검사 완료")+" · "+KO[o]+'</div>'+
    (c.hidden?'<div class="kv"><div class="k">🔴 무엇이 숨어있나</div>'+c.hidden+"</div>":"")+
    (c.how?'<div class="kv"><div class="k">🟡 어떻게 작동하나</div>'+c.how+"</div>":"")+
    (c.impact?'<div class="kv"><div class="k">💥 내 기기에 무슨 피해</div>'+c.impact+"</div>":"")+
    (c.action?'<div class="act '+o+'">👉 '+c.action+"</div>":"")+
    '<div class="kv" style="font-size:11px;color:var(--sub)">🔒 기기 안에서 검사 · 판단: '+(c.source==="claude"?"Claude":c.source==="ollama"?"온디바이스 AI":"오프라인 규칙")+"</div>";
}

async function scan(f){
  if(!f) return;
  av.innerHTML=ag.innerHTML='<div class="busy"><span class="spin"></span>기기 안에서 살펴는 중이에요…</div>';
  try{
    const fd=new FormData(); fd.append("file",f);
    const r=await fetch("/v1/scan",{method:"POST",body:fd});
    const v=await r.json();
    if(!r.ok) throw new Error(v.detail||"검사 실패");
    paintAV(v); paintAG(v);
  }catch(e){
    av.innerHTML=ag.innerHTML='<div class="empty">검사에 실패했어요: '+e.message+"</div>";
  }
}
</script>
</body>
</html>
