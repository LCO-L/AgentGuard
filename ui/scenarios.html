<!DOCTYPE html>
<!-- © 2026 DONGHUN LEE · All Rights Reserved · AgentGuard (Proprietary). -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGuard — 탐지 시나리오</title>
<style>
  :root{--ink:#16181D;--sub:#6B7280;--line:#E8E8EA;--accent:#1E5BFF;--bg:#EEF0F3;--card:#fff;
    --crit:#C4283C;--red:#E5484D;--yellow:#B45309;--green:#30A46C;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",system-ui,sans-serif;}
  body{background:var(--bg);color:var(--ink);word-break:keep-all;line-height:1.6;padding:20px 16px 60px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:23px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .lead{color:var(--sub);font-size:13.5px;margin:5px 0 16px;}
  .info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px;}
  .info code{background:var(--bg);border-radius:6px;padding:2px 6px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
  .pill{background:rgba(30,91,255,.1);color:var(--accent);font-weight:800;font-size:11px;border-radius:99px;padding:3px 9px;}
  .cnt{margin-left:auto;font-weight:800;}
  .cat{margin-bottom:8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .cat .n{font-size:12px;color:var(--sub);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .sc{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px;}
  .sc .h{display:flex;justify-content:space-between;align-items:center;}
  .sc .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--sub);}
  .sc .sev{font-size:10.5px;font-weight:800;text-transform:uppercase;}
  .sc .t{font-size:14px;font-weight:800;margin-top:2px;}
  .sc .w{font-size:12.5px;color:#3A3D46;}
  .sc .fix{margin-top:5px;font-size:11px;font-weight:700;color:var(--green);}
  .critical{border-left-color:var(--crit);} .high{border-left-color:var(--red);}
  .medium{border-left-color:#FFB224;} .low{border-left-color:var(--sub);}
  .sev.critical{color:var(--crit);} .sev.high{color:var(--red);} .sev.medium{color:var(--yellow);} .sev.low{color:var(--sub);}
  .empty{color:var(--sub);text-align:center;padding:40px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🧩 탐지 시나리오</h1>
    <div class="lead">지금 잡을 수 있는 보안 시나리오예요. 새 공격 유형은 <b>데이터 한 줄</b>이면 추가됩니다.</div>
    <div class="info">
      <span class="pill">＋ 확장성</span>
      <span class="sub"><code>rulepacks/scenarios_data.py</code> 에 Scenario(...) 한 줄을 추가하면
        인스펙션·에디터·익스텐션·통역이 자동으로 잡습니다.</span>
      <span class="cnt" id="total">…</span>
    </div>
    <div id="body"><div class="empty">불러오는 중…</div></div>
  </div>

  <script src="/nav.js"></script>
  <script>
  const CAT={secret:"비밀값",pii:"개인정보",vuln:"취약코드",agency:"과잉권한",inject:"인젝션",stego:"은닉"};
  const esc=s=>String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  fetch("/v1/scenarios").then(r=>r.json()).then(d=>{
    const scen=d.scenarios||[]; const stats=d.stats||{};
    document.getElementById("total").textContent="총 "+((stats.regex_scenarios)||scen.length)+"개 시나리오";
    const by={};
    scen.forEach(s=>{(by[s.category]=by[s.category]||[]).push(s);});
    let html="";
    Object.keys(by).forEach(cat=>{
      html+='<div class="cat">'+(CAT[cat]||cat)+'<span class="n">'+by[cat].length+'</span></div><div class="grid">';
      by[cat].forEach(s=>{
        html+='<div class="sc '+s.severity+'"><div class="h"><span class="id">'+esc(s.id)+'</span>'+
          '<span class="sev '+s.severity+'">'+s.severity+'</span></div>'+
          '<div class="t">'+esc(s.title)+'</div><div class="w">'+esc(s.why)+'</div>'+
          (s.has_fix?'<div class="fix">✓ 수정안 제공</div>':'')+'</div>';
      });
      html+='</div>';
    });
    document.getElementById("body").innerHTML=html||'<div class="empty">시나리오가 없어요.</div>';
  }).catch(()=>{document.getElementById("body").innerHTML='<div class="empty">백엔드에 연결할 수 없어요.</div>';});
  </script>
</body>
</html>
